<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicsOJ - Physics Online Judge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
    <header id="site-header">
        <div class="header-inner">
            <a href="#home" class="logo">
                <span class="logo-icon">&#9883;</span>
                <span class="logo-text">PhysicsOJ</span>
            </a>
            <nav id="main-nav">
                <a href="#home" data-page="home">Home</a>
                <a href="#problems" data-page="problems">Problems</a>
                <a href="#competitions" data-page="competitions">Competitions</a>
                <a href="#leaderboard" data-page="leaderboard">Leaderboard</a>
                <a href="#history" data-page="history">History</a>
            </nav>
            <div class="header-user" onclick="promptUsername()">
                <span class="user-icon">&#9679;</span>
                <span id="username-display">guest</span>
            </div>
        </div>
    </header>

    <main id="app">
        <div class="loading-spinner">
            <div class="spinner"></div>
        </div>
    </main>

    <footer>
        <p>PhysicsOJ &mdash; Physics Online Judge System</p>
    </footer>

    <script src="/static/js/app.js"></script>
</body>
</html>
